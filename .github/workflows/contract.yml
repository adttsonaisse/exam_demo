name: contract

on:
  pull_request:
    paths:
      - 'exam_demo_web/routes/api.php'
      - 'exam_demo_web/app/Http/Controllers/Api/**'
      - 'docs/api-contract.md'
      - '.github/workflows/contract.yml'

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check contract doc updated
        run: |
          echo "PR ini menyentuh API Flutter ↔ Laravel."
          echo "Wajib:"
          echo "  1. Update docs/api-contract.md (request/response/error)."
          echo "  2. Tandai breaking change di judul PR: feat(api)!: ..."
          echo "  3. Pastikan Flutter diupdate di PR yang sama/berikutnya."
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^docs/api-contract.md$'; then
            echo "::warning::docs/api-contract.md belum diubah di PR yang menyentuh API."
          fi
