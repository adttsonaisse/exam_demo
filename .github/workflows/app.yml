name: app

on:
  push:
    branches:
      - main
    paths:
      - 'exam_demo_app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'exam_demo_app/**'
      - '.github/workflows/app.yml'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam_demo_app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@fd06463bf589218c5f358963a3cace7f919412aa # v2.21.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
